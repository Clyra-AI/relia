name: relia advisory

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: relia-advisory-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  advise:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v6.3.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache: true
      - name: Prepare advisory inputs
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p .relia/reports
          gh pr diff "$PR_NUMBER" --patch > .relia/pr.diff
          comments_json=.relia/reports/github-comments.json
          gh api --paginate --slurp "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" > "$comments_json"
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          def flatten_comments(payload):
              if isinstance(payload, list) and all(isinstance(page, list) for page in payload):
                  return [comment for page in payload for comment in page]
              if isinstance(payload, list):
                  return payload
              return []

          comments = flatten_comments(json.loads(Path(".relia/reports/github-comments.json").read_text() or "[]"))
          marker = "<!-- relia-advisory:v1"
          fingerprint = ""
          pattern = re.compile(r"<!--\s*relia-advisory:v1\s+diff_fingerprint=([^ >]+)\s*-->")
          for comment in comments:
              body = comment.get("body") or ""
              if marker not in body:
                  continue
              match = pattern.search(body)
              if match:
                  fingerprint = match.group(1)
                  break
          if fingerprint:
              Path(".relia/reports/advisory-state.json").write_text(json.dumps({
                  "object_type": "relia.advisory_state",
                  "schema_version": "1.0",
                  "diff_fingerprint": fingerprint,
                  "metadata": {"source": "existing_github_comment_marker"}
              }, indent=2, sort_keys=True) + "\n")
          PY
      - name: Build PR advisory
        run: |
          set -euo pipefail
          go run ./cmd/relia --json advise --input .relia/pr.diff --format json > .relia/reports/advisory-result.json
      - name: Publish one advisory comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          def flatten_comments(payload):
              if isinstance(payload, list) and all(isinstance(page, list) for page in payload):
                  return [comment for page in payload for comment in page]
              if isinstance(payload, list):
                  return payload
              return []

          result = json.loads(Path(".relia/reports/advisory-result.json").read_text())
          data = result.get("data") or {}
          if not bool(data.get("should_comment")):
              print("Relia advisory skipped: " + str(data.get("skip_reason") or "no_comment_needed"))
              raise SystemExit(0)

          comments = flatten_comments(json.loads(Path(".relia/reports/github-comments.json").read_text() or "[]"))
          comment_id = ""
          for comment in comments:
              body = comment.get("body") or ""
              if "<!-- relia-advisory:v1" in body:
                  comment_id = str(comment["id"])
                  break

          Path(".relia/reports/advisory-body.json").write_text(json.dumps({
              "body": Path(".relia/reports/advisory-comment.md").read_text()
          }))

          repository = os.environ["REPOSITORY"]
          pr_number = os.environ["PR_NUMBER"]
          if comment_id:
              command = [
                  "gh", "api", "--method", "PATCH",
                  f"repos/{repository}/issues/comments/{comment_id}",
                  "--input", ".relia/reports/advisory-body.json",
              ]
              failure_action = "update the existing comment"
          else
              command = [
                  "gh", "api", "--method", "POST",
                  f"repos/{repository}/issues/{pr_number}/comments",
                  "--input", ".relia/reports/advisory-body.json",
              ]
              failure_action = "create the advisory comment"
          completed = subprocess.run(command, stdout=subprocess.DEVNULL)
          if completed.returncode != 0:
              print("Relia advisory publish skipped: GitHub token could not " + failure_action)
              raise SystemExit(0)
          PY
